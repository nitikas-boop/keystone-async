name: keystone

# Ollama runs on the host (GPU), reached via host.docker.internal. See .env.example.
services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: keystone_owner
      POSTGRES_PASSWORD: keystone_owner_dev
      POSTGRES_DB: keystone
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keystone_owner", "-d", "keystone"]
      interval: 5s
      retries: 20

  neo4j:
    image: neo4j:5.26.12-community
    environment:
      NEO4J_AUTH: neo4j/keystone-dev-pw
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4jdata:/data
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "keystone-dev-pw", "RETURN 1"]
      interval: 10s
      retries: 30

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://keystone_app:keystone_app_dev@postgres:5432/keystone
      TEST_DATABASE_URL: postgresql://keystone_app:keystone_app_dev@postgres:5432/keystone_test
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: keystone-dev-pw
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      EXTRACT_OLLAMA_URL: ${EXTRACT_OLLAMA_URL:-http://host.docker.internal:11434}
      ANSWER_MODEL: ${ANSWER_MODEL:-qwen2.5-7b-16k}
      EXTRACT_MODEL: ${EXTRACT_MODEL:-qwen2.5-7b-16k}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      GRAPHITI_TELEMETRY_ENABLED: "false"
      VAULT_DIR: /vault
      OUTBOX_DIR: /outbox
    volumes:
      - ./backend:/app
      - ./data/vault:/vault
      - ./outbox:/outbox
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      neo4j: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 12

  # Separate process: the only component that acts, and only on human-approved rows (§6.9).
  executor:
    build: ./backend
    command: ["python", "-m", "app.executor"]
    environment:
      DATABASE_URL: postgresql://keystone_app:keystone_app_dev@postgres:5432/keystone
      OUTBOX_DIR: /outbox
    volumes:
      - ./backend:/app
      - ./outbox:/outbox
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  pgdata:
  neo4jdata:
